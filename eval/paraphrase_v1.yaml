  - id: "P-07"
    category: "T2"
    split: "paraphrase"
    base: "T2-003"
    difficulty: "hard"
    question: "2025 年哪些项目回款率最差？给我前三名。"
    notes: "用“最差”代替“最低”。"

  - id: "P-08"
    category: "T1"
    split: "paraphrase"
    base: "T1-005"
    difficulty: "easy"
    question: "P-127 这个项目 Q4 做了多少收入？"
    notes: "口语化，指代不变。"

  - id: "P-09"
    category: "T2"
    split: "paraphrase"
    base: "T2-006"
    difficulty: "medium"
    question: "2025 年 Q4 成本最高的五个项目。"
    notes: "中文数字 + 省略“是哪些”。"

  - id: "P-10"
    category: "T2"
    split: "paraphrase"
